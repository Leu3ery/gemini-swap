name: Release Gemini Swap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    name: Build Cross-Platform CLI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: gemini-swap-linux-amd64
            archive: gemini-swap-linux-amd64.tar.gz
          - os: linux
            arch: arm64
            output: gemini-swap-linux-arm64
            archive: gemini-swap-linux-arm64.tar.gz
          - os: darwin
            arch: amd64
            output: gemini-swap-darwin-amd64
            archive: gemini-swap-darwin-amd64.tar.gz
          - os: darwin
            arch: arm64
            output: gemini-swap-darwin-arm64
            archive: gemini-swap-darwin-arm64.tar.gz
          - os: windows
            arch: amd64
            output: gemini-swap-windows-amd64.exe
            archive: gemini-swap-windows-amd64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.output }} ./cmd/gemini-swap
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -q ${{ matrix.archive }} ${{ matrix.output }}
          else
            tar -czf ${{ matrix.archive }} ${{ matrix.output }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.output }}
          path: dist/${{ matrix.archive }}

  build-macos-app:
    name: Build macOS Swift App
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build CLI & App Bundle
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Upload App Archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/GeminiSwap-macOS.zip

  publish-release:
    name: Create GitHub Release
    needs: [build-cli, build-macos-app]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
